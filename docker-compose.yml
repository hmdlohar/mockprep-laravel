services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mockprep_app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - HOME=/tmp

  mysql:
    image: mysql:8.0
    container_name: mockprep_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mockprep
      MYSQL_USER: mockprep
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    driver: local
